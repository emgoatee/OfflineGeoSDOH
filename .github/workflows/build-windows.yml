name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true  # Enable Git LFS if needed

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Check for data files
      run: |
        if (Test-Path "data") {
          Write-Host "Data directory found"
          Get-ChildItem data -Name
        } else {
          Write-Host "Warning: data directory not found"
          Write-Host "Creating empty data directory for build"
          New-Item -ItemType Directory -Path data -Force
        }
      shell: powershell

    - name: Create Windows icon
      run: python create_windows_icon.py

    - name: Build executable with PyInstaller
      run: pyinstaller OfflineGeoLocator_windows.spec --clean

    - name: Verify executable was created
      run: |
        if (Test-Path "dist\OfflineGeoSDOH.exe") {
          Write-Host "Executable built successfully"
          $size = (Get-Item "dist\OfflineGeoSDOH.exe").Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Error "Build failed: Executable not found"
          exit 1
        }
      shell: powershell

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        refreshenv

    - name: Create installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss

    - name: Verify installer was created
      run: |
        $installer = Get-ChildItem -Filter "OfflineGeoSDOH-Installer-*.exe" | Select-Object -First 1
        if ($installer) {
          Write-Host "Installer created: $($installer.Name)"
          $size = $installer.Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Error "Installer creation failed"
          exit 1
        }
      shell: powershell

    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/OfflineGeoSDOH.exe

    - name: Upload installer as artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: OfflineGeoSDOH-Installer-*.exe

    - name: Create Release (if tag pushed)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OfflineGeoSDOH-Installer-*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
