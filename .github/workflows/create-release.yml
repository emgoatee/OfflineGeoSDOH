name: Create Multi-Platform Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.1.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Create data directory
      run: |
        if (-not (Test-Path "data")) {
          Write-Host "Creating data directory"
          New-Item -ItemType Directory -Path data -Force
        }
      shell: powershell

    - name: Create Windows icon
      run: python create_windows_icon.py

    - name: Build with PyInstaller
      run: pyinstaller OfflineGeoLocator_windows.spec --clean

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Create installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: OfflineGeoSDOH-Installer-v*-Windows.exe
        retention-days: 7

  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Create data directory
      run: mkdir -p data

    - name: Build with PyInstaller
      run: pyinstaller OfflineGeoLocator_core.spec --clean

    - name: Copy executable into app bundle
      run: |
        cp "dist/OfflineGeoLocator" "installer/Offline GEO-SDOH.app/Contents/Resources/OfflineGeoLocator_executable"
        chmod +x "installer/Offline GEO-SDOH.app/Contents/Resources/OfflineGeoLocator_executable"

    - name: Set up code signing
      if: ${{ secrets.APPLE_CERTIFICATE != '' }}
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain"
        KEYCHAIN_PASSWORD="temp-keychain-password"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" \
          -k "$KEYCHAIN_PATH" \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s \
          -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Build installer package
      env:
        VERSION: ${{ steps.version.outputs.version }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        chmod +x build_installer.sh
        ./build_installer.sh

    - name: Upload Mac artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mac-installer
        path: |
          OfflineGeoLocator-v*-macOS.zip
          OfflineGeoLocator-Installer-v*.pkg
        retention-days: 7

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: windows-installer

    - name: Download Mac Installer
      uses: actions/download-artifact@v4
      with:
        name: mac-installer

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Offline GEO-SDOH ${{ steps.tag.outputs.tag }}
        body: |
          # Offline GEO-SDOH ${{ steps.tag.outputs.tag }}

          **Complete offline geocoding and Social Determinants of Health (SDOH) indices lookup**

          ## Downloads

          ### Windows
          - **Windows Installer**: `OfflineGeoSDOH-Installer-v${{ steps.tag.outputs.tag }}-Windows.exe`
            - One-click installer for Windows 10/11
            - Includes app and dependencies
            - ~180MB download

          ### macOS
          - **Mac App (ZIP)**: `OfflineGeoLocator-v${{ steps.tag.outputs.tag }}-macOS.zip`
            - Extract and move to Applications
            - For macOS 10.13 or later
          - **Mac Installer (PKG)**: `OfflineGeoLocator-Installer-v${{ steps.tag.outputs.tag }}.pkg`
            - One-click installer (if available)

          ### Data Packages (All Platforms)
          - **Core Data** (Required): `core_data.zip`
          - **State Packages**: Download state ZIP files as needed

          ## What's New

          See [CHANGELOG.md](https://github.com/emgoatee/OfflineGeoSDOH/blob/main/CHANGELOG.md) for details.

          ## Installation

          ### Windows
          1. Download `OfflineGeoSDOH-Installer-v${{ steps.tag.outputs.tag }}-Windows.exe`
          2. Run the installer
          3. Launch from Start Menu
          4. Download states on first run

          ### macOS
          1. Download `OfflineGeoLocator-v${{ steps.tag.outputs.tag }}-macOS.zip`
          2. Extract and drag `Offline GEO-SDOH.app` to Applications
          3. Right-click → Open (to bypass Gatekeeper on first launch)
          4. Download states on first run

          ## System Requirements

          - **Windows**: Windows 10/11 (64-bit)
          - **macOS**: macOS 10.13 or later
          - **Disk Space**: 500MB + space for states you download
          - **Internet**: Only needed for initial install and state downloads

          ---

          🤖 Built with automated CI/CD

          Developed by [GooteeMD](https://www.linkedin.com/in/ecem-tombas/)
        files: |
          OfflineGeoSDOH-Installer-v*-Windows.exe
          OfflineGeoLocator-v*-macOS.zip
          OfflineGeoLocator-Installer-v*.pkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
